<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock Paper Scissors</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <header>
        <div class="panel">Rock Paper Scissors</div>
    </header>
    <main >
        <div class="mainPic">
        <button class="rock btn"></button>
        <button class="paper btn"></button>
        <button class="scissors btn"></button>
        </div>
        <div class="scoreBoard">
            <div class="Score">
                <div class="userScore">0</div>
                <div>You</div>
            </div>
            <div class="Score">
                <div class="compScore">0</div>
                <div>Comp</div>
            </div>
        </div>
        <div class="msg">Play Your Move!</div>
    </main>
</body>
</html>
